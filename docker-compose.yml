# Full stack in Docker:   docker compose up --build
# Only the database:      docker compose up -d mongo   (then run backend/frontend locally)
services:
  mongo:
    image: mongo:7
    container_name: focusmind-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build: ./backend
    container_name: focusmind-backend
    restart: unless-stopped
    # authSource=admin is required because MONGO_INITDB_ROOT_USERNAME creates
    # the user in the "admin" database. Without it, MongoDB tries to authenticate
    # against MONGO_DB_NAME and fails.
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DB_NAME}?authSource=admin
      MONGO_DB_NAME: ${MONGO_DB_NAME}
      SECRET_KEY: ${SECRET_KEY}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ENV: ${ENV:-development}
      # Uploaded lesson videos live on a named volume, so they survive
      # container recreation. Served only through the authorized API.
      VIDEO_STORAGE_DIR: /data/videos
      MAX_VIDEO_UPLOAD_BYTES: ${MAX_VIDEO_UPLOAD_BYTES:-1073741824}
      USER_VIDEO_QUOTA_BYTES: ${USER_VIDEO_QUOTA_BYTES:-5368709120}
      SEED_CATALOG: ${SEED_CATALOG:-false}
      # Optional: delete learning sessions/attention segments older than N days
      # on startup (0 = keep). Progress, quizzes and bookmarks are never removed.
      ATTENTION_RETENTION_DAYS: ${ATTENTION_RETENTION_DAYS:-0}
    volumes:
      - video_data:/data/videos
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      # /api/health also checks the MongoDB connection.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: focusmind-frontend
    restart: unless-stopped
    environment:
      # The browser calls /api on the frontend origin; Vite forwards it to the
      # backend container. VITE_API_URL is left empty on purpose.
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s

volumes:
  mongo_data:
  video_data:
