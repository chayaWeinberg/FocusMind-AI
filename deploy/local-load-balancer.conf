# Local stand-in for the Google Cloud Load Balancer (docker-compose.prod.yml only).
# Same rules as the URL map in the cloud:
#   /api/* and /health  → server container (8000)
#   everything else     → client container (3000)
server {
    listen 80;
    server_tokens off;
    # Lesson video uploads go through the API.
    client_max_body_size 1100m;

    location = /health {
        proxy_pass http://server:8000;
        proxy_set_header Host $http_host;
    }

    location /api/ {
        proxy_pass http://server:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://client:3000;
        proxy_set_header Host $http_host;
    }
}
