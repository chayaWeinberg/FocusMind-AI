# Production-like stack on a single Docker host (also used for the local
# deployment rehearsal). Google Cloud Run does not use this file; see
# docs/DEPLOYMENT-HE.md.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# MongoDB is not published outside the internal network. Data and uploaded
# videos live on named volumes and survive restarts and image rebuilds.
name: ${COMPOSE_PROJECT_NAME:-focusmind-prod}

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?set MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  app:
    build: .
    image: focusmind-ai:latest
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DB_NAME:-focusmind}?authSource=admin
      MONGO_DB_NAME: ${MONGO_DB_NAME:-focusmind}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY (at least 32 bytes)}
      ENV: ${ENV:-production}
      SEED_CATALOG: ${SEED_CATALOG:-true}
      MAX_VIDEO_UPLOAD_BYTES: ${MAX_VIDEO_UPLOAD_BYTES:-1073741824}
      USER_VIDEO_QUOTA_BYTES: ${USER_VIDEO_QUOTA_BYTES:-5368709120}
      ATTENTION_RETENTION_DAYS: ${ATTENTION_RETENTION_DAYS:-0}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-120}
    volumes:
      - video_data:/data/videos
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
  video_data:
