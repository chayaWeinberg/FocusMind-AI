# Production rehearsal on one Docker host: the same two images that run on
# Google Cloud Run, plus a small nginx that plays the role of the Google Load
# Balancer (same path rules as the cloud URL map). Cloud Run does not use this
# file; see docs/DEPLOYMENT-HE.md.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#   http://localhost:8080   (and http://localhost:8080/health)
#
#   Browser ─▶ lb :8080 ─┬─ /api/* and /health ─▶ server :8000 ─▶ mongo
#                        └─ everything else    ─▶ client :3000
#
# MongoDB is not published outside the internal network. Data and uploaded
# videos live on named volumes and survive restarts and image rebuilds.
name: ${COMPOSE_PROJECT_NAME:-focusmind-prod}

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?set MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  server:
    build: ./backend
    image: focusmind-server:latest
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DB_NAME:-focusmind}?authSource=admin
      MONGO_DB_NAME: ${MONGO_DB_NAME:-focusmind}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY (at least 32 bytes)}
      # Secure cookie, /docs off. Browsers accept Secure cookies on
      # http://localhost, so the rehearsal works without HTTPS.
      ENV: ${ENV:-production}
      SEED_CATALOG: ${SEED_CATALOG:-true}
      MAX_VIDEO_UPLOAD_BYTES: ${MAX_VIDEO_UPLOAD_BYTES:-1073741824}
      USER_VIDEO_QUOTA_BYTES: ${USER_VIDEO_QUOTA_BYTES:-5368709120}
      ATTENTION_RETENTION_DAYS: ${ATTENTION_RETENTION_DAYS:-0}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-120}
    volumes:
      - video_data:/data/videos
    depends_on:
      mongo:
        condition: service_healthy

  client:
    build: ./frontend
    image: focusmind-client:latest
    restart: unless-stopped

  lb:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./deploy/local-load-balancer.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    depends_on:
      - server
      - client

volumes:
  mongo_data:
  video_data:
